name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Typst 0.15.0
        run: |
          curl -L https://github.com/typst/typst/releases/download/v0.15.0/typst-x86_64-unknown-linux-musl.tar.xz -o typst.tar.xz
          tar -xf typst.tar.xz
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      - name: Generate version file
        run: |
          BUILD_DATE=$(TZ=Europe/Berlin date +%Y%m%d)
          echo "#let version = \"v0.1.$BUILD_DATE\"" > version.typ

      - name: Render PDF
        run: |
          mkdir -p public
          typst compile \
            --font-path assets/fonts \
            main.typ \
            public/algebra-lernskript.pdf

      - name: Create index page
        run: |
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>Algebra Lernskript</title>
            </head>
            <body>
              <h1>Algebra Lernskript</h1>
              <p><a href="algebra-lernskript.pdf">Download 16gb of free DDR5 RAM now!!</a></p>
            </body>
          </html>
          EOF

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: algebra-lernskript-pdf
          path: public/algebra-lernskript.pdf

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: render
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
